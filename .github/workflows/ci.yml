name: Validate static site
on:
  push:
    branches-ignore: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build staging and validate public artifact
        env:
          BASE_PATH: /civitassolis-staging
          SITE_NOINDEX: '1'
          SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 tools/build.py
          python3 tools/check.py
          python3 tools/check_seo.py
          node --check static/assets/app.js
      - name: Desktop, mobile, keyboard and no-JavaScript journeys
        run: node tools/browser-check.mjs
      - name: Validate root-domain build
        env:
          BASE_PATH: ''
          SITE_ORIGIN: https://civitassolis.org.br
        run: |
          python3 tools/build.py
          python3 tools/check.py
          python3 tools/check_seo.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: review-evidence
          path: .artifacts/
          retention-days: 14
